[workspace]
resolver = "3"
members = ["crates/aio-core", "crates/aio-llm", "crates/aio-app"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
aio-core = { path = "crates/aio-core" }
aio-llm = { path = "crates/aio-llm" }
async-trait = "0.1"
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
egui = "0.36"
egui-snarl = "0.12"
reqwest = { version = "0.13", features = ["json", "stream"] }
futures-util = "0.3"
petgraph = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = { version = "0.40", default-features = false, features = ["system"] }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "process", "io-util"] }
rusqlite = { version = "0.37", features = ["bundled"] }
regex = "1"
flate2 = "1"
tar = "0.4"
sha2 = "0.10"
uuid = { version = "1", features = ["v4", "serde"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
