name: Release

# Push a tag like v0.2.0 (or v0.2.0-beta.1 for a pre-release) to build and publish.
# The app's Settings tab picks the release up and offers a one-click update.
# To build for a release that already exists (or if the tag push did not trigger a run):
# Actions -> Release -> Run workflow, and enter the tag, e.g. v0.1.0. It builds the branch you pick.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build and attach files to (e.g. v0.1.0)'
        required: true

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-14, target: aarch64-apple-darwin }
          - { os: macos-14, target: x86_64-apple-darwin }
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev libssl-dev libdbus-1-dev pkg-config
      - name: Stamp the version from the tag
        shell: bash
        run: |
          python3 - <<'PY'
          import os, re
          v = os.environ["TAG"].lstrip("v")
          s = open("Cargo.toml").read()
          s = re.sub(r'(?m)^version = ".*"$', f'version = "{v}"', s, count=1)
          open("Cargo.toml", "w").write(s)
          PY
      - name: Test
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: cargo test --workspace
      - name: Build
        run: cargo build --release -p aio-app --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          bin=all-in-one
          if [ "$RUNNER_OS" = "Windows" ]; then bin=all-in-one.exe; fi
          name=all-in-one-${{ matrix.target }}.tar.gz
          mkdir -p dist
          tar -czf "dist/$name" -C "target/${{ matrix.target }}/release" "$bin"
          (cd dist && (sha256sum "$name" 2>/dev/null || shasum -a 256 "$name") | cut -d' ' -f1 > "$name.sha256")
      - name: macOS app and disk image
        if: runner.os == 'macOS'
        run: |
          mkdir -p target/release
          cp "target/${{ matrix.target }}/release/all-in-one" target/release/all-in-one
          scripts/make-app.sh "$TAG"
          [ "${{ matrix.target }}" = x86_64-apple-darwin ] && mv dist/All-In-One-*.dmg dist/All-In-One-x86_64.dmg || true
          rm -rf "dist/All In One.app"
      - uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.target }}
          path: dist/*

  publish:
    needs: build
    # Publish whatever built, even if one platform failed.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ contains(env.TAG, '-') }}
